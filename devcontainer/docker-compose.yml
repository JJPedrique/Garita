version: '3.8'

services:
  app:
    image: mcr.microsoft.com/devcontainers/java:1-8-bullseye
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    network_mode: service:db # Comparte la red para usar 'localhost'

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: Garita
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: